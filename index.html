 "kind": "shop", "lat": 30.249, "lng": -97.7497, "notes": "Boutiques, vintage, cowboy boots and food trucks. Best for slow wandering.", "status": "idea", "title": "South Congress Avenue", "id": "i-soco"}, {"city": "austin", "day": "", "indoor": true, "kind": "kids", "lat": 30.2985, "lng": -97.7066, "notes": "Hands-on children's museum in Mueller. A good outing for the 6 kids.", "status": "idea", "title": "Thinkery", "url": "https://thinkeryaustin.org", "id": "i-thinkery"}, {"city": "seattle", "day": "", "indoor": true, "kind": "sight", "lat": 47.6021, "lng": -122.3343, "notes": "Walk the buried streets of old Seattle. Book ahead.", "status": "idea", "title": "Pioneer Square & Underground Tour", "url": "https://www.undergroundtour.com", "id": "i-underground"}, {"address": "777 NE Martin Luther King Jr Blvd, Portland", "city": "portland", "day": "", "kind": "other", "lat": 45.5287, "lng": -122.6631, "notes": "Portland base if that trip happens (Dec 4–6, TBD).", "status": "idea", "title": "Oregon Convention Center", "id": "pdx-occ"}, {"address": "17000 W I-10, San Antonio", "city": "sa", "day": "2026-11-21", "flex": "Sat or Sun", "kind": "kids", "lat": 29.5998, "lng": -98.6094, "notes": "Holiday in the Park season starts Nov 21 on select dates. Check the park calendar before buying tickets.", "status": "planned", "title": "Six Flags Fiesta Texas", "url": "https://www.sixflags.com/fiestatexas", "id": "sixflags"}, {"city": "austin", "day": "2026-11-18", "kind": "stay", "notes": "Tap Edit to add the address and check-in time.", "status": "planned", "title": "Austin stay", "id": "stay-aus"}, {"city": "seattle", "day": "2026-11-30", "kind": "stay", "lat": 47.7543, "lng": -122.1635, "notes": "Same Woodinville home as your 2022 and 2025 trips. About 30–40 min to downtown Seattle without traffic.", "status": "planned", "title": "Seattle stay (Woodinville)", "id": "stay-sea"}], "days": {"2026-11-27": {"city": "austin", "label": "Family gathering · Black Friday", "mood": "family <title>USA Trip - Winter 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column (phone first). Sticky tab bar; each day is a strip whose left edge carries the city colour. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#18202C; --muted:#5E6878; --line:#D8DDE4;
  --austin:#C0255F; --austin-soft:#FBE7EE;
  --sa:#B86A00; --sa-soft:#FBF0DC;
  --seattle:#14705B; --seattle-soft:#DEF1EB;
  --portland:#6B4FA0; --portland-soft:#ECE6F6;
  --travel:#3A4A8C; --travel-soft:#E3E7F6;
  --done:#14705B; --chip:#E8EBF0;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --surface:#18202B; --ink:#E7EBF1; --muted:#98A3B3; --line:#2B3542;
  --austin:#FF6A9C; --austin-soft:#3A1A27; --sa:#F0A43A; --sa-soft:#36280F;
  --seattle:#4CC9A6; --seattle-soft:#10302A; --portland:#B59BEA; --portland-soft:#2A2140; --travel:#8EA0F0; --travel-soft:#1E2544;
  --done:#4CC9A6; --chip:#232D3A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#18202B; --ink:#E7EBF1; --muted:#98A3B3; --line:#2B3542;
  --austin:#FF6A9C; --austin-soft:#3A1A27; --sa:#F0A43A; --sa-soft:#36280F;
  --seattle:#4CC9A6; --seattle-soft:#10302A; --portland:#B59BEA; --portland-soft:#2A2140; --travel:#8EA0F0; --travel-soft:#1E2544;
  --done:#4CC9A6; --chip:#232D3A; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(30px,8vw,44px);font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--travel);outline-offset:2px}

/* header */
.hero{display:grid;gap:12px;margin-bottom:18px}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px}
.route span.c{padding:3px 8px;border-radius:4px;font-weight:700}
.route .arrow{color:var(--muted)}
.c.austin{background:var(--austin-soft);color:var(--austin)}
.c.sa{background:var(--sa-soft);color:var(--sa)}
.c.seattle{background:var(--seattle-soft);color:var(--seattle)}
.c.portland{background:var(--portland-soft);color:var(--portland)}
.c.travel{background:var(--travel-soft);color:var(--travel)}
.stats{display:flex;flex-wrap:wrap;gap:18px;font-size:13px}
.stats b{font-family:var(--f-display);font-size:22px;display:block;line-height:1}
.status-note{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--chip)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding-block:8px;margin-bottom:14px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{flex:1 0 auto;text-align:center;text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:8px;font-weight:700;font-size:14px}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* day strips */
.days{display:grid;gap:10px}
.day{background:var(--surface);border-radius:10px;padding:12px 14px 12px 16px;border-left:5px solid var(--cityc);display:grid;gap:8px}
.day.austin{--cityc:var(--austin);--citys:var(--austin-soft)}
.day.sa{--cityc:var(--sa);--citys:var(--sa-soft)}
.day.seattle{--cityc:var(--seattle);--citys:var(--seattle-soft)}
.day.portland{--cityc:var(--portland);--citys:var(--portland-soft)}
.day.travel{--cityc:var(--travel);--citys:var(--travel-soft)}
.day.past{opacity:.72}
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayhead .date{font-family:var(--f-display);font-weight:800;font-size:19px}
.dayhead .city{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cityc);font-weight:700}
.dayhead .mood{margin-left:auto;font-size:12px;color:var(--muted)}
.daylabel{font-weight:700}
.daynote{font-size:14px;color:var(--muted);white-space:pre-wrap}
.stops{display:grid;gap:6px}
.stop{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;background:var(--citys,var(--chip));border-radius:8px;min-width:0}
.stop .tm{font-family:var(--f-mono);font-size:12px;min-width:44px;padding-top:2px;color:var(--muted)}
.stop .body{flex:1;min-width:0}
.stop .t{font-weight:700;overflow-wrap:anywhere}
.stop .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.stop.done .t{text-decoration:line-through;text-decoration-color:var(--done);text-decoration-thickness:2px}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0}
.check.on{background:var(--done);border-color:var(--done);color:var(--surface)}
.check svg{width:14px;height:14px}
.iconbtn{flex:none;background:none;border:none;color:var(--muted);padding:2px 4px;font-size:13px;text-decoration:underline}
.dayactions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.small{padding:4px 10px;font-size:12px}
.flex{border:1px dashed var(--cityc);color:var(--cityc);border-radius:6px;padding:1px 6px;font-size:11px;font-family:var(--f-mono);font-weight:700}

/* boarding pass */
.pass{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;font-family:var(--f-mono)}
.pass .code{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1}
.pass .r{text-align:right}
.pass .plane{color:var(--muted);font-size:12px;text-align:center}
.pass small{display:block;font-size:11px;color:var(--muted)}

/* ideas */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ideas{display:grid;gap:8px}
.idea{background:var(--surface);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:flex-start;border-left:4px solid var(--cityc)}
.idea.austin{--cityc:var(--austin)}.idea.sa{--cityc:var(--sa)}.idea.seattle{--cityc:var(--seattle)}.idea.portland{--cityc:var(--portland)}.idea.travel{--cityc:var(--travel)}
.idea .body{flex:1;min-width:0}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--chip);border-radius:4px;padding:1px 6px;margin-right:4px;color:var(--muted)}
.suggest{background:var(--surface);border-radius:12px;padding:14px;margin-bottom:16px;display:grid;gap:10px;border:1px solid var(--line)}
.suggest ol{margin:0;padding-left:20px;display:grid;gap:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* map */
.mapbox{background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.mapbox>svg{display:block;width:100%;height:auto;touch-action:manipulation}
.leaflet-attribution-flag{display:none!important}
.leaflet-container img{max-width:none!important}
.leaflet-popup-content a{color:var(--travel);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pick{background:var(--surface);border-radius:10px;padding:12px;margin-top:10px;display:grid;gap:6px}
.far{margin-top:12px;display:grid;gap:6px}

.cardacts{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.star{width:28px;height:28px;border-radius:50%;border:none;background:transparent;color:var(--muted);font-size:22px;line-height:1;padding:0}
.star.on{color:var(--austin)}
.stopacts{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.wx{font-size:12px}
.wear{font-size:13px;background:var(--chip);border-radius:8px;padding:8px 10px;display:grid;gap:2px}
.wear.alert{background:var(--travel-soft);border-left:4px solid var(--travel)}
.wear a{color:var(--cityc);font-weight:700}
.wx a{color:var(--cityc);font-weight:700}
.tag.plant-vegan{background:var(--seattle-soft);color:var(--seattle);font-weight:700}
.tag.plant-some{background:var(--sa-soft);color:var(--sa);font-weight:700}
.tag.plant-nondairy{background:var(--travel-soft);color:var(--travel);font-weight:700}
.climate{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:16px}
.climate div{background:var(--surface);border-radius:10px;padding:10px 12px;border-top:4px solid var(--cityc);font-size:13px;display:grid;gap:2px}
.climate .austin{--cityc:var(--austin)}.climate .sa{--cityc:var(--sa)}.climate .seattle{--cityc:var(--seattle)}.climate .portland{--cityc:var(--portland)}
.climate b{font-family:var(--f-display);font-size:16px}
.climate a{color:var(--cityc);font-weight:700}
/* calendar */
.month{margin-bottom:22px}
.month h2{margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{min-height:78px;border-radius:8px;background:transparent;border:1px dashed var(--line);padding:5px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;color:var(--muted)}
.cell.on{background:var(--citys);border:none;color:var(--ink);border-top:4px solid var(--cityc)}
.cell.austin{--cityc:var(--austin);--citys:var(--austin-soft)}
.cell.sa{--cityc:var(--sa);--citys:var(--sa-soft)}
.cell.seattle{--cityc:var(--seattle);--citys:var(--seattle-soft)}
.cell.portland{--cityc:var(--portland);--citys:var(--portland-soft)}
.cell.travel{--cityc:var(--travel);--citys:var(--travel-soft)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell .n{font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1}
.cell .lb{font-size:11px;line-height:1.25;font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.cell .dots{margin-top:auto;display:flex;gap:3px;flex-wrap:wrap}
.cell .dots i{width:6px;height:6px;border-radius:50%;background:var(--cityc)}
.cell .dots i.d{background:var(--done)}
.cell .dots i.f{border-radius:1px;transform:rotate(45deg);background:var(--travel)}
.callegend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
@media (min-width:560px){.cell{min-height:96px}.cell .lb{font-size:12px}}

/* journal */
.jday{display:grid;gap:8px;margin-bottom:18px}
.jentry{background:var(--surface);border-radius:10px;padding:12px;display:grid;gap:4px}
.stars{color:var(--sa);letter-spacing:2px}
.empty{background:var(--surface);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}

/* editor */
.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.field{display:grid;gap:4px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px}
.field textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ratepick{display:flex;gap:4px}
.ratepick button{background:none;border:none;font-size:22px;color:var(--line);padding:0 2px}
.ratepick button.on{color:var(--sa)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:30}
@media (prefers-reduced-motion:no-preference){.day,.idea{transition:opacity .2s}}
</style>

<div class="wrap">
  <header class="hero">
    <div class="eyebrow">Nov 17 – Dec 11, 2026</div>
    <h1>Austin to Seattle</h1>
    <div class="route">
      <span class="c travel">TLV</span><span class="arrow">→</span><span class="c travel">EWR</span><span class="arrow">→</span>
      <span class="c austin">AUS</span><span class="arrow">↔</span><span class="c sa">SAT</span><span class="arrow">→</span>
      <span class="c seattle">SEA</span><span class="arrow">↔</span><span class="c portland">PDX</span><span class="arrow">→</span><span class="c travel">FRA</span><span class="arrow">→</span><span class="c travel">TLV</span>
    </div>
    <div class="stats" id="stats"></div>
    <div class="status-note" id="syncNote" hidden></div>
  </header>

  <nav class="tabs" aria-label="Sections">
    <a href="#plan" data-tab="plan">Days</a>
    <a href="#calendar" data-tab="calendar">Calendar</a>
    <a href="#ideas" data-tab="ideas">Ideas</a>
    <a href="#dining" data-tab="dining">Dining</a>
    <a href="#map" data-tab="map">Map</a>
    <a href="#journal" data-tab="journal">Journal</a>
  </nav>

  <section id="v-plan"></section>
  <section id="v-calendar" hidden></section>
  <section id="v-ideas" hidden></section>
  <section id="v-dining" hidden></section>
  <section id="v-map" hidden></section>
  <section id="v-journal" hidden></section>
</div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const START="2026-11-18", END="2026-12-10";
const CITY={austin:"Austin",sa:"San Antonio",seattle:"Seattle",portland:"Portland",travel:"Travel"};
const KINDS={flight:"Flight",stay:"Stay",sight:"Sight",food:"Food",sweets:"Donuts & sweets",shop:"Shopping",kids:"With kids",outdoors:"Outdoors",music:"Music",daytrip:"Day trip",event:"Event",other:"Other"};
const MOOD={rest:"Rest day",easy:"Easy",family:"Family",explore:"Explore",travel:"Travel day"};
// Typical late-Nov / early-Dec conditions (climate averages, not a forecast).
const CLIMATE={
  austin:{hi:"20°C",lo:"8°C",tip:"Mild and mostly dry. A cold front can drop nights to around 5°C, so pack a jacket.",fc:"https://forecast.weather.gov/MapClick.php?lat=30.505&lon=-97.82"},
  sa:{hi:"21°C",lo:"9°C",tip:"Usually pleasant. Evenings at Six Flags get chilly; bring layers.",fc:"https://forecast.weather.gov/MapClick.php?lat=29.42&lon=-98.49"},
  seattle:{hi:"8°C",lo:"3°C",tip:"Light rain on most days and sunset around 4:20pm. Do outdoor things before 3:30 and keep an indoor backup.",fc:"https://forecast.weather.gov/MapClick.php?lat=47.61&lon=-122.33"},
  portland:{hi:"9°C",lo:"3°C",tip:"Grey and drizzly most days, short daylight. Columbia Gorge waterfalls are at their fullest, but trails get slick: wear grippy waterproof shoes.",fc:"https://forecast.weather.gov/MapClick.php?lat=45.53&lon=-122.66"},
  travel:null
};
// Default city per date (the trip's shape); a day doc can override it.
function defaultCity(d){
  if(d>="2026-11-21"&&d<="2026-11-22")return "sa";
  if(d==="2026-11-30")return "travel";
  if(d>="2026-12-01")return "seattle";
  return "austin";
}

/* ---------- state ---------- */
let stops=[], days={}, mode="loading", db=null, readOnly=false;
const ui={tab:"plan",dineType:"all",dineCity:"all",dineWho:"all",ideaCity:"all",ideaKind:"all",mapCity:"austin",mapDay:"",picked:null};
try{const s=JSON.parse(localStorage.getItem("trip-ui")||"{}");Object.assign(ui,{ideaCity:s.ideaCity||"all",mapCity:s.mapCity||"austin"});}catch(e){}
function saveUi(){try{localStorage.setItem("trip-ui",JSON.stringify({ideaCity:ui.ideaCity,mapCity:ui.mapCity}));}catch(e){}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function dateList(){const out=[];let d=new Date(START+"T12:00:00Z");const e=new Date(END+"T12:00:00Z");while(d<=e){out.push(d.toISOString().slice(0,10));d=new Date(d.getTime()+864e5);}return out;}
const DAYS=dateList();
function fmtDay(d){const x=new Date(d+"T12:00:00Z");return {wd:x.toLocaleDateString("en-US",{weekday:"short",timeZone:"UTC"}),md:x.toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"})};}
function today(){const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");}
function cityOf(d){return (days[d]&&days[d].city)||defaultCity(d);}
function fmtTime(t){if(!t)return "";const [h,m]=t.split(":").map(Number);const ap=h>=12?"pm":"am";return ((h%12)||12)+(m?":"+String(m).padStart(2,"0"):"")+ap;}
function km(a,b){const R=6371,toR=Math.PI/180;const dLat=(b.lat-a.lat)*toR,dLng=(b.lng-a.lng)*toR;const h=Math.sin(dLat/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function hasLoc(s){return typeof s.lat==="number"&&typeof s.lng==="number"&&!isNaN(s.lat);}
// Opens Google Maps ready to navigate. A street address beats an approximate pin.
function gmaps(s){const addr=(s.address||"").split(" · ")[0];const st=CITY[s.city]&&s.city!=="travel"?(s.city==="seattle"?", WA":s.city==="portland"?", OR":", TX"):"";
  const q=/\d/.test(addr)?s.title+", "+addr+st:hasLoc(s)?s.lat+","+s.lng:s.title+" "+(addr||CITY[s.city]||"");
  return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(q);}
// Rough drive estimate from where you're based in that city: road distance ≈ straight line × 1.3, at ~45 km/h in town, faster on longer trips.
function baseFor(city){
  const pick=ids=>ids.map(id=>stops.find(x=>x.id===id)).find(x=>x&&hasLoc(x));
  if(city==="seattle")return pick(["stay-sea"]);
  if(city==="portland")return pick(["pdx-occ"]);
  if(city==="austin")return pick(["stay-aus","family-cp"]);
  return null;
}
function driveText(s){
  if(!hasLoc(s))return "";const b=baseFor(s.city);if(!b||b.id===s.id)return "";
  const road=km(b,s)*1.3, spd=road<15?40:road<40?55:75, min=Math.max(5,Math.round(road/spd*60/5)*5);
  const from=b.id==="family-cp"?"Cedar Park":b.id==="stay-sea"?"Woodinville":"your stay";
  return `<span class="mono">~${min<60?min+" min":(min/60).toFixed(1).replace(".0","")+" hr"} · ${road.toFixed(0)} km</span> from ${from}`;
}
function starBtn(s){return `<button class="star ${s.wish?"on":""}" data-act="wish" data-id="${s.id}" aria-pressed="${!!s.wish}" aria-label="${s.wish?"Remove from":"Add to"} wish list: ${esc(s.title)}" ${readOnly?"disabled":""}>${s.wish?"★":"☆"}</button>`;}
function webUrl(s){return s.url||("https://www.google.com/search?q="+encodeURIComponent(s.title+" "+(s.address||CITY[s.city]||"")));}
function webLink(s,cls){if(s.kind==="flight"||s.kind==="stay"&&!s.url)return "";return `<a class="${cls||"btn small"}" href="${webUrl(s)}" target="_blank" rel="noopener" style="text-decoration:none">${s.url?"Website":"Google"}</a>`;}
function parseLoc(str){if(!str)return null;let m=str.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||str.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||str.match(/(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);if(!m)return null;const lat=parseFloat(m[1]),lng=parseFloat(m[2]);if(Math.abs(lat)>90||Math.abs(lng)>180)return null;return {lat,lng};}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200);}
const CHECK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

/* ---------- storage ---------- */
const LS_KEY="trip-local-v1";
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS_KEY)||"{}");stops=j.stops||[];days=j.days||{};}catch(e){stops=[];days={};}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({stops,days,snap:window.__TRIP__.version}));}catch(e){}}
let writing=Promise.resolve();
function queue(fn){writing=writing.then(fn).catch(err=>{if(err&&err.code==="invalid_argument"){readOnly=true;toast("You can view this trip but not change it.");render();}else{toast("Couldn't save that change. Try again in a moment.");}});return writing;}
function saveStop(s){
  s.updatedAt=new Date().toISOString();
  const i=stops.findIndex(x=>x.id===s.id); if(i>=0)stops[i]=s; else stops.push(s);
  render();
  if(mode==="db"){const {id,...body}=s;return queue(()=>db.collection("stops").doc(id).set(body));}
  saveLocal();
}
function removeStop(id){
  stops=stops.filter(x=>x.id!==id);render();
  if(mode==="db")return queue(()=>db.collection("stops").doc(id).delete());
  saveLocal();
}
function saveDay(d,obj){
  days[d]=obj;render();
  if(mode==="db")return queue(()=>db.collection("days").doc(d).set(obj));
  saveLocal();
}
function newId(){return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ---------- header ---------- */
function renderStats(){
  const t=today();
  const dep="2026-11-17";
  let lead;
  if(t<dep){const n=Math.round((new Date(dep+"T12:00:00Z")-new Date(t+"T12:00:00Z"))/864e5);lead=`<span><b>${n}</b>days to go</span>`;}
  else if(t<="2026-12-11"){const i=DAYS.indexOf(t);lead=`<span><b>${i>=0?"Day "+(i+1):"En route"}</b>of ${DAYS.length}</span>`;}
  else lead=`<span><b>Home</b>trip complete</span>`;
  const real=stops.filter(s=>s.kind!=="flight");
  const visited=real.filter(s=>s.status==="done").length;
  const planned=real.filter(s=>s.day).length;
  const ideas=real.filter(s=>!s.day&&s.status!=="done").length;
  $("#stats").innerHTML=lead+`<span><b>${planned}</b>on the calendar</span><span><b>${ideas}</b>ideas to pick from</span><span><b>${visited}</b>places visited</span>`;
  const note=$("#syncNote");
  if(mode==="loading"){note.hidden=false;note.textContent="Loading your trip…";}
  else if(mode==="slow"){note.hidden=false;note.textContent="Your saved trip hasn't loaded yet. Check your connection; it will appear here when it does.";}
  else if(mode==="local"){note.hidden=false;note.textContent="Shared trip plan, updated "+window.__TRIP__.updated+". Anything you tick or note here is saved on this device only.";}
  else if(readOnly){note.hidden=false;note.textContent="View only. Ask the trip owner for edit access to tick things off.";}
  else note.hidden=true;
}

/* ---------- Days view ---------- */
function stopRow(s){
  const sub=[s.address, s.kind==="stay"?"Stay":"", s.conf?"Conf "+s.conf:""].filter(Boolean).join(" · ");
  const dt=s.kind==="stay"?"":driveText(s);
  const flexT=s.flex?`<span class="flex">${esc(s.flex)}</span> `:"";
  return `<div class="stop ${s.status==="done"?"done":""}">
    <button class="check ${s.status==="done"?"on":""}" data-act="toggle" data-id="${s.id}" aria-label="${s.status==="done"?"Mark not visited":"Mark visited"}: ${esc(s.title)}" ${readOnly?"disabled":""}>${s.status==="done"?CHECK:""}</button>
    <div class="tm">${esc(fmtTime(s.time))}</div>
    <div class="body"><div class="t">${flexT}${esc(s.title)}</div>${sub?`<div class="sub">${esc(sub)}</div>`:""}${dt?`<div class="sub">🚗 ${dt}</div>`:""}${s.notes?`<div class="sub">${esc(s.notes)}</div>`:""}</div>
    <div class="stopacts">${s.kind==="stay"&&!s.address?"":`<a class="iconbtn" href="${gmaps(s)}" target="_blank" rel="noopener">Navigate</a>`}${webLink(s,"iconbtn")}<button class="iconbtn" data-act="edit" data-id="${s.id}">Edit</button></div>
  </div>`;
}
function flightRow(s){
  return `<div class="stop ${s.status==="done"?"done":""}">
    <div class="body"><div class="pass">
      <div><span class="code">${esc(s.from||"")}</span><small>${esc(fmtTime(s.time))||"time TBD"}</small></div>
      <div class="plane">${esc(s.flight||"✈")}<small>${esc(s.cabin||"")}</small></div>
      <div class="r"><span class="code">${esc(s.to||"")}</span><small>${esc(s.arrive||"")}</small></div>
    </div>${s.notes?`<div class="sub" style="margin-top:6px">${esc(s.notes)}</div>`:""}</div>
    <button class="iconbtn" data-act="edit" data-id="${s.id}">Edit</button>
  </div>`;
}
function wearLine(d,c,info,list){
  const outdoor=list.some(s=>!s.indoor&&(s.kind==="outdoors"||s.kind==="daytrip"||s.kind==="kids"||s.kind==="sight"));
  if(info.wx&&info.wx.summary){
    const w=info.wx, alert=w.alert?" alert":"";
    return `<div class="wear${alert}"><div><b>${w.alert?"Dress for the weather":"Forecast"}:</b> ${esc(w.summary)}${w.hi!=null?` <span class="mono">${esc(w.hi)}° / ${esc(w.lo)}°C</span>`:""}</div>${w.dress?`<div>${esc(w.dress)}</div>`:""}<div class="muted" style="font-size:11px">Updated ${esc(w.asOf||"")} · <a href="${CLIMATE[c]?CLIMATE[c].fc:"#"}" target="_blank" rel="noopener">Latest forecast</a></div></div>`;
  }
  if(!CLIMATE[c])return "";
  let dress=c==="seattle"?(outdoor?"Outdoor plans: rain jacket, waterproof shoes and a warm layer.":"Bring a rain jacket."):(outdoor?"Outdoors in the evening: bring a warm layer.":"");
  return `<div class="wx"><span class="mono">${CLIMATE[c].hi} · ${CLIMATE[c].lo}</span> <span class="muted">typical</span>${dress?" · "+dress:""} · <a href="${CLIMATE[c].fc}" target="_blank" rel="noopener">Forecast</a></div>`;
}
function pairHints(d,list){
  const hints=[];
  list.forEach(s=>{(s.pairWith||[]).forEach(pid=>{const p=stops.find(x=>x.id===pid);if(p&&p.day!==d&&p.status!=="done"&&!hints.includes(p))hints.push(p);});});
  return hints.map(p=>`<div class="wear alert"><div><b>★ Wish list, nearby:</b> ${esc(p.title)}${p.notes?` <span class="muted">· ${esc(p.notes)}</span>`:""}</div>${readOnly?"":`<div><button class="btn small" data-act="setday" data-id="${p.id}" data-day="${d}">Add to this day</button></div>`}</div>`).join("");
}
function renderPlan(){
  const t=today();
  const wishes=stops.filter(s=>s.wish&&!s.day&&s.status!=="done");
  const wishBox=wishes.length?`<div class="suggest" style="border-color:var(--austin)"><h3>★ Wish list, not on a day yet</h3><div class="stops">${wishes.map(s=>`<div class="stop" style="--citys:var(--chip)"><div class="body"><div class="t">${esc(s.title)}</div><div class="sub">${CITY[s.city]}${s.notes?" · "+esc(s.notes):""}</div></div>${readOnly?"":`<button class="btn small" data-act="schedule" data-id="${s.id}">Pick a day</button>`}</div>`).join("")}</div></div>`:"";
  const html=DAYS.map(d=>{
    const c=cityOf(d), info=days[d]||{}, f=fmtDay(d);
    const list=stops.filter(s=>s.day===d).sort((a,b)=>(a.kind==="flight"?-1:0)-(b.kind==="flight"?-1:0)||(a.time||"99").localeCompare(b.time||"99"));
    return `<article class="day ${c} ${d<t?"past":""}" id="d-${d}">
      <div class="dayhead"><span class="date">${f.wd} ${f.md}</span><span class="city">${CITY[c]}</span>${info.mood?`<span class="mood">${esc(MOOD[info.mood]||info.mood)}</span>`:""}</div>
      ${info.label?`<div class="daylabel">${esc(info.label)}</div>`:""}
      ${info.note?`<div class="daynote">${esc(info.note)}</div>`:""}
      ${d>=t?wearLine(d,c,info,list):""}
      ${pairHints(d,list)}
      ${list.length?`<div class="stops">${list.map(s=>s.kind==="flight"?flightRow(s):stopRow(s)).join("")}</div>`:(!info.label?`<div class="daynote">Nothing planned. That's allowed.</div>`:"")}
      ${readOnly?"":`<div class="dayactions"><button class="btn small" data-act="add" data-day="${d}">Add</button><button class="btn small" data-act="pickfor" data-day="${d}">Pick from ideas</button><button class="btn small" data-act="editday" data-day="${d}">Day notes</button></div>`}
    </article>`;
  }).join("");
  const clim=`<div class="climate">${["austin","sa","seattle","portland"].map(c=>`<div class="${c}"><b>${CITY[c]}</b><span class="mono">High ${CLIMATE[c].hi} · Low ${CLIMATE[c].lo}</span><span class="muted">${CLIMATE[c].tip}</span><a href="${CLIMATE[c].fc}" target="_blank" rel="noopener">Live forecast</a></div>`).join("")}</div>`;
  $("#v-plan").innerHTML=clim+wishBox+`<div class="days">${html}</div>`;
}

/* ---------- Dining view ---------- */
const WHO={couple:"Just us two",family:"With family",either:"Either"};
const PLANT={vegan:"Vegan",some:"Some vegan items",nondairy:"Non-dairy only"};
function renderDining(){
  const diet=days.__diet||null;
  const cities=["all","austin","sa","seattle","portland"];
  const pool=stops.filter(s=>(s.kind==="food"||s.kind==="sweets")&&(ui.dineType==="all"||(ui.dineType==="sweets"?s.kind==="sweets":s.kind==="food"))&&(ui.dineCity==="all"||s.city===ui.dineCity)&&(ui.dineWho==="all"||s.who===ui.dineWho||s.who==="either"||!s.who));
  pool.sort((a,b)=>(a.status==="done")-(b.status==="done")||(!!b.wish)-(!!a.wish)||a.city.localeCompare(b.city)||a.title.localeCompare(b.title));
  $("#v-dining").innerHTML=`
    <div class="suggest" style="border-color:var(--sa)">
      <div class="row" style="justify-content:space-between"><h3>Dietary needs</h3>${readOnly?"":`<button class="btn small" data-act="editdiet">${diet&&diet.text?"Edit":"Add"}</button>`}</div>
      ${diet&&diet.text?`<div style="white-space:pre-wrap">${esc(diet.text)}</div>`:`<div class="muted">One of us is vegan and one is strict low-FODMAP. Each restaurant below has a "Diet fit" note.</div>`}
      <div class="muted" style="font-size:12px">Always confirm with the restaurant. Menus and kitchens change.</div>
    </div>
    <div class="filters" role="group" aria-label="City">${cities.map(c=>`<button class="chipbtn" aria-pressed="${ui.dineCity===c}" data-act="dinecity" data-v="${c}">${c==="all"?"All cities":CITY[c]}</button>`).join("")}</div>
    <div class="filters" role="group" aria-label="Type">${[["all","Everything"],["food","Meals"],["sweets","Donuts & sweets"]].map(([k,l])=>`<button class="chipbtn" aria-pressed="${ui.dineType===k}" data-act="dinetype" data-v="${k}">${l}</button>`).join("")}</div>
    <div class="filters" role="group" aria-label="Who's eating">${["all","couple","family"].map(w=>`<button class="chipbtn" aria-pressed="${ui.dineWho===w}" data-act="dinewho" data-v="${w}">${w==="all"?"Anyone":WHO[w]}</button>`).join("")}</div>
    ${readOnly?"":`<div class="row" style="margin-bottom:12px"><button class="btn primary" data-act="adddine">Add a restaurant</button></div>`}
    <div class="ideas">${pool.length?pool.map(s=>`<div class="idea ${s.city}"><div class="body">
      <div>${s.wish?`<span class="tag" style="background:var(--austin-soft);color:var(--austin);font-weight:700">★ Wish list</span>`:""}<span class="tag">${CITY[s.city]}</span>${s.plant?`<span class="tag plant-${s.plant}">${esc(PLANT[s.plant])}</span>`:""}${s.who?`<span class="tag">${esc(WHO[s.who]||s.who)}</span>`:""}${s.day?`<span class="tag">${fmtDay(s.day).wd} ${fmtDay(s.day).md}</span>`:""}</div>
      <div style="font-weight:700;margin-top:4px">${esc(s.title)}</div>
      ${s.address?`<div class="muted" style="font-size:13px">${esc(s.address)}</div>`:""}
      ${driveText(s)?`<div style="font-size:12px">🚗 ${driveText(s)}</div>`:""}
      ${s.notes?`<div class="muted" style="font-size:14px">${esc(s.notes)}</div>`:""}
      <div style="font-size:13px;margin-top:4px"><b>Diet fit:</b> ${s.dietFit?esc(s.dietFit):`<span class="muted">Not checked yet</span>`}</div>
      <div class="row" style="margin-top:8px">${readOnly||s.day?"":`<button class="btn small" data-act="schedule" data-id="${s.id}">Put on a day</button>`}${webLink(s)}<a class="btn small" href="${gmaps(s)}" target="_blank" rel="noopener" style="text-decoration:none">Navigate</a>${readOnly?"":`<button class="iconbtn" data-act="edit" data-id="${s.id}">Edit</button>`}</div>
    </div><div class="cardacts"><button class="check ${s.status==="done"?"on":""}" data-act="toggle" data-id="${s.id}" aria-label="Mark eaten here: ${esc(s.title)}" ${readOnly?"disabled":""}>${s.status==="done"?CHECK:""}</button>${starBtn(s)}</div></div>`).join(""):`<div class="empty">No restaurants match. Try another city or "Anyone".</div>`}</div>`;
}
function openDiet(){

      cells+=`<button class="cell on ${c} ${iso===t?"today":""}" data-act="gotoday" data-day="${iso}" aria-label="${fmtDay(iso).wd} ${fmtDay(iso).md}, ${CITY[c]}${label?", "+esc(label):""}"><span class="n">${d}</span>${label?`<span class="lb">${esc(label)}</span>`:""}${flex&&!info.label?"":""}<span class="dots">${dots}</span></button>`;

function suggestDay(city){
  const pool=stops.filter(s=>s.city===city&&!s.day&&s.status!=="done"&&s.kind!=="daytrip"&&s.kind!=="flight"&&s.kind!=="stay"&&hasLoc(s));
  if(pool.length<2)return null;
  // densest spot: the idea with most neighbours within 3 km, then its 2 nearest — three stops keeps it relaxed
  let best=null,bestScore=-1;
  pool.forEach(p=>{const sc=pool.filter(q=>q!==p&&km(p,q)<3).length+(p.kind==="food"?0.1:0)+Math.random()*0.5;if(sc>bestScore){bestScore=sc;best=p;}});
  const near=pool.filter(q=>q!==best).sort((a,b)=>km(best,a)-km(best,b)).slice(0,2);
  const set=[best,...near];
  // order: sights first, food near the end
  set.sort((a,b)=>(a.kind==="food")-(b.kind==="food"));
  let dist=0;for(let i=1;i<set.length;i++)dist+=km(set[i-1],set[i]);
  return {set,dist};
}

  const pts=local.length?local:LANDMARKS[c].map(([n,lat,lng])=>({lat,lng}));
  let minLat=Math.min(...pts.map(p=>p.lat)),maxLat=Math.max(...pts.map(p=>p.lat)),minLng=Math.min(...pts.map(p=>p.lng)),maxLng=Math.max(...pts.map(p=>p.lng));
  const padLat=Math.max((maxLat-minLat)*0.12,0.006),padLng=Math.max((maxLng-minLng)*0.12,0.008);
  minLat-=padLat;maxLat+=padLat;minLng-=padLng;maxLng+=padLng;
  const kx=Math.cos((minLat+maxLat)/2*Math.PI/180);
  const W=600; let H=Math.round(W*(maxLat-minLat)/((maxLng-minLng)*kx));
  if(H<360){const need=(360/W)*(maxLng-minLng)*kx-(maxLat-minLat);minLat-=need/2;maxLat+=need/2;H=360;}
  if(H>720){const need=((maxLat-minLat)/(720/W))/kx-(maxLng-minLng);minLng-=need/2;maxLng+=need/2;H=720;}
  const X=lng=>((lng-minLng)/(maxLng-minLng))*W, Y=lat=>((maxLat-lat)/(maxLat-minLat))*H;

      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${sel?10:7}" fill="${fill}" stroke="${s.status==="done"?"var(--done)":col}" stroke-width="2.5"/>
      ${s.status==="done"?`<path d="M${(x-3.5).toFixed(1)} ${y.toFixed(1)}l2.5 2.5 4.5-5" fill="none" stroke="var(--surface)" stroke-width="2"/>`:""}
      ${sel||ui.mapDay&&!dim?`<text x="${(x+12).toFixed(1)}" y="${(y+4).toFixed(1)}" font-size="13" font-weight="700" fill="var(--ink)" paint-order="stroke" stroke="var(--surface)" stroke-width="4">${esc(s.title)}</text>`:""}
    </g>`;}).join("");
  const p=stops.find(s=>s.id===ui.picked&&s.city===c);
  $("#v-map").innerHTML=`
    <div class="filters" role="group" aria-label="City">${["austin","sa","seattle","portland"].map(k=>`<button class="chipbtn" aria-pressed="${c===k}" data-act="mapcity" data-v="${k}">${CITY[k]}</button>`).join("")}</div>
    <div class="row" style="margin-bottom:10px"><label for="mapDay" class="muted" style="font-size:13px">Show route for</label>
      <select id="mapDay" class="btn small"><option value="">All places</option>${cityDays.map(d=>{const f=fmtDay(d);return `<option value="${d}" ${ui.mapDay===d?"selected":""}>${f.wd} ${f.md}</option>`;}).join("")}</select></div>
    ${dayRouteLink(c)}
    ${REAL?`<div class="mapbox"><div id="lmap" style="height:62vh;min-height:360px"></div>`:`<div class="mapbox"><svg viewBox="0 0 ${W} ${H}" aria-label="Map of ${CITY[c]} places"><rect width="${W}" height="${H}" fill="var(--surface)"/>${grid}${marks}${route}${dots}
      <g transform="translate(${W-70},${H-20})"><line x1="0" y1="0" x2="${(X(minLng+1/(111*kx))-X(minLng)).toFixed(1)}" y2="0" stroke="var(--muted)" stroke-width="2"/><text x="0" y="-5" font-family="var(--f-mono)" font-size="10" fill="var(--muted)">1 km</text></g>

  const sel=$("#mapDay");sel.onchange=()=>{ui.mapDay=sel.value;renderMap();};

/* Real street map (used where the page may load map tiles, e.g. the family copy). */
const REAL=!!(window.__REALMAP__&&window.L);
let lmap=null;
function drawRealMap(c,local){
  if(lmap){lmap.remove();lmap=null;}
  const el=document.getElementById("lmap");if(!el)return;
  lmap=L.map(el,{scrollWheelZoom:false});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(lmap);
  const col=getComputedStyle(document.documentElement).getPropertyValue("--"+c).trim()||"#c0255f";
  const done=getComputedStyle(document.documentElement).getPropertyValue("--done").trim()||"#14705B";
  const pts=[];
  local.forEach(s=>{const dim=ui.mapDay&&s.day!==ui.mapDay;
    const m=L.circleMarker([s.lat,s.lng],{radius:8,color:s.status==="done"?done:col,weight:3,fillColor:s.status==="done"?done:s.day?col:"#fff",fillOpacity:dim?0.3:1,opacity:dim?0.3:1}).addTo(lmap);
    m.bindPopup(`<b>${esc(s.title)}</b>${s.day?"<br>"+fmtDay(s.day).wd+" "+fmtDay(s.day).md:""}<br><a href="${gmaps(s)}" target="_blank" rel="noopener">Navigate</a> · <a href="${webUrl(s)}" target="_blank" rel="noopener">${s.url?"Website":"Google"}</a>`);
    if(!dim)pts.push([s.lat,s.lng]);});
  if(ui.mapDay){const r=local.filter(s=>s.day===ui.mapDay).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));if(r.length>1)L.polyline(r.map(s=>[s.lat,s.lng]),{color:col,weight:4,dashArray:"6 6"}).addTo(lmap);}
  const all=pts.length?pts:(LANDMARKS[c]||[]).map(x=>[x[1],x[2]]);
  if(all.length>1)lmap.fitBounds(all,{padding:[30,30]});else if(all.length)lmap.setView(all[0],12);
}
// One tap opens the whole day's route in Google Maps, stops in time order.
function dayRouteLink(c){
  if(!ui.mapDay)return "";

  if(!r.length)return "";

  const url="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+encodeURIComponent(dest)+(wps?"&waypoints="+encodeURIComponent(wps):"");
  return `<div class="row" style="margin-bottom:10px"><a class="btn primary small" style="text-decoration:none" href="${url}" target="_blank" rel="noopener">Open this day's route in Google Maps (${r.length} stop${r.length>1?"s":""})</a></div>`;

      <div class="field"><label for="f-time">Time (optional)</label><input id="f-time" type="time" value="${esc(s.time||"")}"></div>
    </div>
    ${isFlight?`<div class="grid2"><div class="field"><label for="f-from">From</label><input id="f-from" value="${esc(s.from||"")}"></div><div class="field"><label for="f-to">To</label><input id="f-to" value="${esc(s.to||"")}"></div></div>
      <div class="grid2"><div class="field"><label for="f-flight">Flight</label><input id="f-flight" value="${esc(s.flight||"")}"></div><div class="field"><label for="f-arrive">Arrives</label><input id="f-arrive" value="${esc(s.arrive||"")}"></div></div>`:""}
    ${s.kind==="food"||s.kind==="sweets"?`<div class="field"><label for="f-plant">Plant-based</label><select id="f-plant"><option value="">Unknown</option>${Object.keys(PLANT).map(k=>`<option value="${k}" ${s.plant===k?"selected":""}>${PLANT[k]}</option>`).join("")}</select></div><div class="grid2"><div class="field"><label for="f-who">Good for</label><select id="f-who"><option value="">—</option>${Object.keys(WHO).map(k=>`<option value="${k}" ${s.who===k?"selected":""}>${WHO[k]}</option>`).join("")}</select></div><div class="field"><label for="f-diet">Diet fit</label><input id="f-diet" value="${esc(s.dietFit||"")}" placeholder="e.g. kosher-style options"></div></div>`:""}
    <div class="field"><label for="f-flex">Flexible tag (optional)</label><input id="f-flex" value="${esc(s.flex||"")}" placeholder="e.g. Sat or Sun"></div>
    <div class="field"><label for="f-url">Website (optional)</label><input id="f-url" type="url" value="${esc(s.url||"")}" placeholder="https://"></div>
    <div class="field"><label for="f-addr">Address or area</label><input id="f-addr" value="${esc(s.address||"")}"></div>
    <div class="field"><label for="f-loc">Map location: paste a Google Maps link or "lat, lng"</label><input id="f-loc" value="${hasLoc(s)?s.lat+", "+s.lng:""}" placeholder="https://maps.app… or 30.2638, -97.7713"></div>
    <div class="field"><label for="f-notes">Plan notes</label><textarea id="f-notes">${esc(s.notes||"")}</textarea></div>
    <label class="row" style="font-weight:700"><input type="checkbox" id="f-wish" ${s.wish?"checked":""}> ★ On our wish list</label>
    <label class="row" style="font-weight:700"><input type="checkbox" id="f-indoor" ${s.indoor?"checked":""}> Good in rain (mostly indoors)</label>
    <label class="row" style="font-weight:700"><input type="checkbox" id="f-done" ${s.status==="done"?"checked":""}> We've been here</label>
    <div class="field"><label>Rating</label><div class="ratepick" id="f-rate">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" class="${(s.rating||0)>=n?"on":""}" aria-label="${n} stars">★</button>`).join("")}</div></div>
    <div class="field"><label for="f-mem">Journal note (after you've been)</label><textarea id="f-mem" placeholder="What stood out, what you'd order again…">${esc(s.memory||"")}</textarea></div>
    <div class="row" style="justify-content:space-between">
      ${isNew?"<span></span>":`<button class="btn" id="f-del" data-armed="0">Delete</button>`}
      <div class="row"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="f-save">Save</button></div>
    </div>
  </div></div>`;
  let rating=s.rating||0;
  $("#f-rate").onclick=e=>{const b=e.target.closest("button");if(!b)return;const n=+b.dataset.n;rating=rating===n?0:n;[...$("#f-rate").children].forEach(x=>x.classList.toggle("on",+x.dataset.n<=rating));};
  $("#f-save").onclick=()=>{
    const title=$("#f-title").value.trim();if(!title){$("#f-title").focus();toast("Give it a name first.");return;}
    const locStr=$("#f-loc").value.trim(); const loc=parseLoc(locStr);
    if(locStr&&!loc){toast("That location wasn't recognised. Paste a Google Maps link or two numbers like 30.26, -97.77.");return;}
    const out=Object.assign({},s,{id:s.id||newId(),title,city:$("#f-city").value,kind:$("#f-kind").value,day:$("#f-day").value,time:$("#f-time").value,flex:$("#f-flex").value.trim(),address:$("#f-addr").value.trim(),url:/^https?:\/\//.test($("#f-url").value.trim())?$("#f-url").value.trim():"",notes:$("#f-notes").value.trim(),memory:$("#f-mem").value.trim(),rating,indoor:$("#f-indoor").checked,wish:$("#f-wish").checked});
    if($("#f-who")){out.who=$("#f-who").value;out.plant=$("#f-plant").value;out.dietFit=$("#f-diet").value.trim();}
    if(isFlight){["from","to","flight","arrive"].forEach(k=>out[k]=$("#f-"+k).value.trim());}
    if(loc){out.lat=loc.lat;out.lng=loc.lng;}else if(!locStr){delete out.lat;delete out.lng;}
    const wasDone=s.status==="done";const nowDone=$("#f-done").checked;
    out.status=nowDone?"done":(out.day?"planned":"idea"); if(nowDone&&!wasDone)out.visitedAt=new Date().toISOString();
    closeSheet();saveStop(out);toast(isNew?"Added":"Saved");
  };
  const del=$("#f-del");if(del)del.onclick=()=>{if(del.dataset.armed==="1"){closeSheet();removeStop(s.id);toast("Deleted");}else{del.dataset.armed="1";del.textContent="Tap again to delete";}};
  setTimeout(()=>$("#f-title").focus(),30);
}
function openDay(d){
  const info=days[d]||{},f=fmtDay(d);
  $("#sheetRoot").innerHTML=`<div class="sheet" data-act="close"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <h2 id="dTitle">${f.wd} ${f.md}</h2>
    <div class="grid2"><div class="field"><label for="d-city">Where you'll be</label><select id="d-city">${Object.keys(CITY).map(k=>`<option value="${k}" ${cityOf(d)===k?"selected":""}>${CITY[k]}</option>`).join("")}</select></div>
    <div class="field"><label for="d-mood">Pace</label><select id="d-mood"><option value="">—</option>${Object.keys(MOOD).map(k=>`<option value="${k}" ${info.mood===k?"selected":""}>${MOOD[k]}</option>`).join("")}</select></div></div>
    <div class="field"><label for="d-label">Headline</label><input id="d-label" value="${esc(info.label||"")}" placeholder="e.g. Birthday dinner"></div>
    <div class="field"><label for="d-note">Notes</label><textarea id="d-note">${esc(info.note||"")}</textarea></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="d-save">Save</button></div>
  </div></div>`;
  $("#d-save").onclick=()=>{const obj={city:$("#d-city").value,mood:$("#d-mood").value,label:$("#d-label").value.trim(),note:$("#d-note").value.trim()};closeSheet();saveDay(d,obj);toast("Saved");};
}
function openSchedule(s){
  const opts=DAYS.filter(d=>cityOf(d)===s.city||s.city==="travel");
  $("#sheetRoot").innerHTML=`<div class="sheet" data-act="close"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <h2 id="sTitle">Which day for ${esc(s.title)}?</h2>
    <div class="days">${(opts.length?opts:DAYS).map(d=>{const f=fmtDay(d),n=stops.filter(x=>x.day===d).length,info=days[d]||{};return `<button class="btn" style="text-align:left;display:flex;justify-content:space-between;gap:8px" data-act="setday" data-id="${s.id}" data-day="${d}"><span>${f.wd} ${f.md}${info.label?" · "+esc(info.label):""}</span><span class="muted mono">${n?n+" planned":"free"}</span></button>`;}).join("")}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button></div></div></div>`;
}
function openPickFor(d){
  const c=cityOf(d);
  const pool=stops.filter(s=>!s.day&&s.status!=="done"&&s.kind!=="flight"&&(s.city===c||c==="travel"));
  const f=fmtDay(d);
  $("#sheetRoot").innerHTML=`<div class="sheet" data-act="close"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <h2 id="pTitle">Ideas for ${f.wd} ${f.md}</h2>
    ${pool.length?`<div class="days">${pool.map(s=>`<button class="btn" style="text-align:left" data-act="setday" data-id="${s.id}" data-day="${d}"><span class="tag">${esc(KINDS[s.kind])}</span> ${esc(s.title)}</button>`).join("")}</div>`:`<div class="muted">No open ${CITY[c]} ideas. Add one from the Ideas tab.</div>`}
    <div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Done</button></div></div></div>`;
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act, id=el.dataset.id, s=id&&stops.find(x=>x.id===id);
  if(act==="close"){if(e.target===el||el.tagName==="BUTTON")closeSheet();return;}
  if(readOnly&&!["ideacity","ideakind","mapcity","pin","reshuffle","dinecity","dinewho","gotoday"].includes(act))return;
  switch(act){
    case "toggle":{if(!s)return;const o=Object.assign({},s);if(o.status==="done"){o.status=o.day?"planned":"idea";}else{o.status="done";o.visitedAt=new Date().toISOString();}saveStop(o);if(o.status==="done")toast("Marked visited. Add a note from the Journal tab.");break;}
    case "edit":if(s)openStop(s,false);break;
    case "add":openStop({day:el.dataset.day||""},true);break;
    case "editday":openDay(el.dataset.day);break;
    case "pickfor":openPickFor(el.dataset.day);break;
    case "schedule":if(s)openSchedule(s);break;
    case "setday":{if(!s)return;closeSheet();saveStop(Object.assign({},s,{day:el.dataset.day,status:s.status==="done"?"done":"planned"}));const f=fmtDay(el.dataset.day);toast("Added to "+f.wd+" "+f.md);break;}
    case "ideacity":ui.ideaCity=el.dataset.v;lastSuggest=null;saveUi();renderIdeas();break;
    case "ideakind":ui.ideaKind=el.dataset.v;renderIdeas();break;
    case "reshuffle":lastSuggest=null;renderIdeas();break;
    case "applysg":{const d=$("#sgDay").value;if(!lastSuggest||!lastSuggest.res)return;const set=lastSuggest.res.set;lastSuggest=null;(async()=>{for(const x of set){await saveStop(Object.assign({},x,{day:d,status:"planned"}));}})();const f=fmtDay(d);toast("Added 3 stops to "+f.wd+" "+f.md);break;}
    case "mapcity":ui.mapCity=el.dataset.v;ui.mapDay="";ui.picked=null;saveUi();renderMap();break;
    case "pin":ui.picked=ui.picked===id?null:id;renderMap();break;
    case "dinecity":ui.dineCity=el.dataset.v;renderDining();break;
    case "wish":{if(!s)return;const o=Object.assign({},s,{wish:!s.wish});saveStop(o);toast(o.wish?"Added to wish list":"Removed from wish list");break;}
    case "dinetype":ui.dineType=el.dataset.v;renderDining();break;
    case "dinewho":ui.dineWho=el.dataset.v;renderDining();break;
    case "adddine":openStop({kind:ui.dineType==="sweets"?"sweets":"food",city:ui.dineCity!=="all"?ui.dineCity:"austin",day:""},true);break;
    case "editdiet":openDiet();break;
    case "gotoday":{const d=el.dataset.day;pendingScroll=d;if(location.hash==="#plan")route();else location.hash="plan";break;}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if((e.key==="Enter"||e.key===" ")&&e.target.matches("g[data-act=pin]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}));}});

/* ---------- routing ---------- */
const TABS=["plan","calendar","ideas","dining","map","journal"];
let pendingScroll=null;
function route(){const h=(location.hash||"#plan").slice(1);ui.tab=TABS.includes(h)?h:"plan";render();
  if(pendingScroll&&ui.tab==="plan"){const el=document.getElementById("d-"+pendingScroll);pendingScroll=null;if(el){el.scrollIntoView({block:"start"});window.scrollBy(0,-64);}}}
window.addEventListener("hashchange",route);
function render(){
  renderStats();
  document.querySelectorAll(".tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===ui.tab?"page":"false"));
  TABS.forEach(t=>{$("#v-"+t).hidden=t!==ui.tab;});
  if(ui.tab==="plan")renderPlan(); else if(ui.tab==="calendar")renderCalendar(); else if(ui.tab==="ideas")renderIdeas(); else if(ui.tab==="dining")renderDining(); else if(ui.tab==="map")renderMap(); else renderJournal();
}

/* ---------- boot ---------- */
route();
const SNAP=window.__TRIP__;
(function(){let local=null;try{local=JSON.parse(localStorage.getItem(LS_KEY)||"null");}catch(e){}
  if(local&&local.snap===SNAP.version){stops=local.stops;days=local.days;}else{stops=SNAP.stops;days=SNAP.days;}
  mode="local";render();})();
(function(){
})();
})();
</script>

</body></html>
